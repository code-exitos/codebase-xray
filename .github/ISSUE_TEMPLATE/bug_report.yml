name: Bug report
description: A skill, agent or script did the wrong thing or failed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems in this plugin go through [SECURITY.md](https://github.com/code-exitos/codebase-xray/blob/main/SECURITY.md), not here.
        Do not paste proprietary code; a small sample that reproduces the problem is best.
  - type: dropdown
    id: component
    attributes:
      label: Where did it happen?
      options:
        - codebase-xray skill
        - extract-rules skill
        - security-sweep skill
        - xray.py (reach / sql / cite / brief / shards / security)
        - render_rules.py
        - Install / plugin loading
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: The `version` in `.claude-plugin/plugin.json`, or what `/plugin` shows.
      placeholder: 1.1.3
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Codebase you ran it on
      description: Language, framework and rough size.
      placeholder: Java 8 / Spring, ~400k LOC, Oracle stored procedures
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, what you got instead, and the error or wrong output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The prompt or command you ran, and a minimal sample if you have one.
